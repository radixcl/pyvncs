stages:
  - mirror

mirror_github:
  stage: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "devel"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "experimental"'
  script:
    - |
      git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/radixcl/pyvncs.git" 2>/dev/null || true
      git fetch origin
      for branch in devel master experimental; do
        if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
          git push github "refs/remotes/origin/$branch:refs/heads/$branch" 2>&1 || echo "Failed to push $branch"
        fi
      done

